# The iPhone app, signed and uploaded to TestFlight: team Ivan Sizyi (ZK66E83UL5), bundle id
# cx.m42.zlink, App Store Connect app «ZLink Lab» (6839080918), internal group `dev`. The same lane
# as Touch VN and RestoApp touch, without Gradle: here the app is SwiftUI and the Xcode project comes
# from ios/project.yml (XcodeGen).
#
# Runs on a push to main that touches the app, on a push to ios/testflight, by hand, or by the label
# `testflight` on a pull request into main. Without the six signing secrets it says so and stops,
# green. Then `distribute` waits for Apple to process the build and checks the group got it.
#
# project.yml keeps dev.zedlink.app, which the simulator workflows launch; only the archive here is
# built as cx.m42.zlink (IOS_BUNDLE_ID). The repository is public, so macOS minutes cost nothing.
name: iOS TestFlight

on:
  push:
    branches: [main, ios/testflight]
    paths:
      - ios/**
      - .github/workflows/ios-testflight.yml
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

# An upload is never cancelled: a newer push waits for the build before it.
concurrency:
  group: ios-testflight-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'cx.m42.zlink' }}
  IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || 'ZK66E83UL5' }}

jobs:
  testflight:
    if: github.event_name != 'pull_request' || github.event.label.name == 'testflight'
    # macos-26: App Store Connect takes only builds made with the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be read in a job-level `if`, so the check is a step with an output.
      - name: Are the signing secrets here?
        id: gate
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -n "$P12" ]          || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE" ]      || missing="$missing IOS_PROFILE_BASE64"
          [ -n "$KEY_ID" ]       || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ]    || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ]           || missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight lane skipped — secrets not set:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Xcode
        if: steps.gate.outputs.ready == 'true'
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Generate the Xcode project
        if: steps.gate.outputs.ready == 'true'
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Signed by hand: automatic signing on a clean runner would mint a development certificate every
      # run, and the API key is an App Manager's. ios-ci-signing.py checks the profile against the
      # certificate and the app and writes the export options.
      - name: Install the certificate, the profile and the App Store Connect key
        id: signing
        if: steps.gate.outputs.ready == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/dist.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 '"' || true)
          if [ -z "$IDENTITY" ]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::IOS_DIST_CERT_P12_BASE64 gave no valid signing identity (what it gave is above)"
            exit 1
          fi
          SHA1=$(echo "$IDENTITY" | awk '{print $2}')
          NAME=$(echo "$IDENTITY" | sed 's/^[^"]*"\(.*\)"$/\1/')
          echo "Signing as: $NAME"

          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(python3 ios/ci/ios-ci-signing.py "$RUNNER_TEMP/profile.plist" "$SHA1" "$NAME")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mv "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" | base64 --decode > "$HOME/private_keys/AuthKey_$KEY_ID.p8"

          echo "identity=$NAME" >> "$GITHUB_OUTPUT"
          echo "profile=$UUID" >> "$GITHUB_OUTPUT"

      # The scheme archives the app target alone (no packages, no resource bundles), so the signing
      # settings can go on the command line. The build number is the run number, so every upload is a
      # new build; the version is MARKETING_VERSION in project.yml. Info.plist answers the encryption
      # question NO (only SHA-256, the Keychain and the system's TLS), so the build does not wait for it.
      - name: Archive
        if: steps.gate.outputs.ready == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/ZedLink.xcodeproj -scheme ZedLink -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ZedLink.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive 2>&1 | tee build/xcodebuild.log

      # `destination: upload` in the export options sends the build straight to App Store Connect.
      - name: Upload to TestFlight
        id: upload
        if: steps.gate.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/ZedLink.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/export.log
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Forget the key
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/profile.plist" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            build/xcodebuild.log
            build/export.log
          retention-days: 14
          if-no-files-found: ignore

  # Apple processes an upload for minutes before a group can have it; the wait happens on Linux. The
  # group is the repository variable TESTFLIGHT_GROUP, `dev` when unset; `dev` takes every build by
  # itself, so this mostly reports.
  distribute:
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Apple, then give the build to the testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: python3 ios/ci/testflight-distribute.py ${{ github.run_number }} "${{ vars.TESTFLIGHT_GROUP || 'dev' }}"
